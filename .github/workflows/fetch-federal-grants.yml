name: Fetch Federal Grants Data

on:
  schedule:
    # Run every 12 hours at 6 AM and 6 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fetch-federal-grants.yml'

jobs:
  fetch-grants:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Verify workspace contents
        run: |
          pwd
          ls -la
          ls -la scripts || true
          test -f scripts/fetch_federal_grants.py || (echo "Missing scripts/fetch_federal_grants.py" && exit 1)
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch federal grants data
        working-directory: scripts
        run: |
          python fetch_federal_grants.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/federal-grants-cache.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to federal grants data"
          else
            git commit -m "Update federal grants data [automated]"
            git push
          fi
